<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(150, 20)">
    <!-- Dark Navy Ring -->
    <path d="M 250 50 C 150 50 70 130 70 230 C 70 330 150 410 250 410 C 290 410 328 396 358 370 L 322 334 C 302 352 277 362 250 362 C 177 362 118 303 118 230 C 118 157 177 98 250 98 C 288 98 322 115 344 142 L 386 104 C 352 69 303 50 250 50 Z" fill="#0b192c"/>
    <path d="M 275 270 L 335 270 L 335 410 L 275 410 Z" fill="#0b192c"/>

    <!-- Ascending Swoosh -->
    <path d="M 70 380 C 120 380 200 350 280 270 C 350 200 410 100 410 100 C 410 100 350 170 270 250 C 200 320 120 345 70 380 Z" fill="url(#goldGrad)"/>
    <circle cx="426" cy="88" r="22" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography ORBITONE -->
  <g transform="translate(400, 480)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="64" font-weight="800" letter-spacing="12">
      <tspan fill="#0b192c">ORBIT</tspan><tspan fill="#d97706">ONE</tspan>
    </text>
  </g>

  <!-- Subtitle TECH SOLUTIONS -->
  <g transform="translate(400, 545)" text-anchor="middle">
    <line x1="120" y1="-8" x2="210" y2="-8" stroke="#d97706" stroke-width="3" />
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="700" letter-spacing="14" fill="#0b192c">
      TECH SOLUTIONS
    </text>
    <line x1="590" y1="-8" x2="680" y2="-8" stroke="#d97706" stroke-width="3" />
  </g>

  <!-- Tagline -->
  <g transform="translate(400, 600)" text-anchor="middle">
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="700" letter-spacing="10" fill="#0b192c">
      INNOVATE  <tspan fill="#d97706">•</tspan>  INTEGRATE  <tspan fill="#d97706">•</tspan>  ELEVATE
    </text>
  </g>
</svg>
